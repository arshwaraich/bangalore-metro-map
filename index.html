<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangalore Metro Map</title>
<meta name="description" content="Namma Metro lines and stations on a map of Bengaluru: what's running, what's being built, and when it's expected to open.">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%238e3fbf' stroke-width='5'/%3E%3Cpath d='M3 16h26' stroke='%231f9d55' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map of Bangalore metro lines"></div>

<header class="card title">
  <h1>Namma Metro</h1>
  <p id="asof">Bengaluru</p>
</header>

<button id="theme" class="card iconbtn" type="button" aria-label="Switch theme" title="Switch theme"></button>

<aside id="panel" class="card panel">
  <button id="panel-toggle" class="panel-head" type="button" aria-expanded="true">
    <span>Lines</span>
    <span class="key">
      <i class="k k-open"></i>running
      <i class="k k-build"></i>building
      <i class="k k-plan"></i>planned
    </span>
    <svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <ul id="lines" class="lines"></ul>
  <p class="foot">Dates are reported targets and slip often. Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles <a href="https://openfreemap.org">OpenFreeMap</a> / <a href="https://www.openmaptiles.org/">OpenMapTiles</a>. <a href="https://github.com/arshwaraich/bangalore-metro-map">Source</a></p>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="app.js"></script>
</body>
</html>
